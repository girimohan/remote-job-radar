name: Daily job radar

on:
  schedule:
    - cron: "23 4 * * *"   # 06:23 Helsinki in winter, 07:23 in summer
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Collect, filter and score
        id: radar
        env:
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar run
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json data/seen.json digests/latest.md
          git diff --cached --quiet || git commit -m "Radar: ${{ steps.radar.outputs.matched }} matches, ${{ steps.radar.outputs.new_today }} new"
          git push
      - name: Send digest (opens an issue, which GitHub emails to you)
        if: steps.radar.outputs.new_today != '0' || steps.radar.outputs.first_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Job radar $(date +%F): ${{ steps.radar.outputs.new_today }} new, ${{ steps.radar.outputs.matched }} open" \
            --body-file digests/latest.md
